name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'react-native/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'react-native/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build-react-native:
    name: Typecheck & Build React Native Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run sample app TypeScript typecheck
        run: npm run typecheck:example

      - name: Run unit tests
        run: npm test

      - name: Build CommonJS, ESM, and TypeScript declarations
        run: npm run build

      - name: Verify npm package contents
        run: npm pack --dry-run
