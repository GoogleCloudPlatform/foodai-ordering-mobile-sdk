// No buildscript classpath here: when autolinked into an RN 0.83 app, AGP, Kotlin and the
// React Native Gradle plugin are already on the app's root build classpath (supplied by
// @react-native/gradle-plugin), and unversioned classpath entries can't resolve in a library.
ext.getExtOrDefault = { prop, defaultValue ->
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : defaultValue
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'com.facebook.react'

def getExtOrIntegerDefault(prop, defaultValue) {
  return rootProject.ext.has(prop) ? rootProject.ext.get(prop).toInteger() : defaultValue
}

def getExtOrStringDefault(prop, defaultValue) {
  return rootProject.ext.has(prop) ? rootProject.ext.get(prop).toString() : defaultValue
}

def foodAiAndroidSdkVersion = getExtOrStringDefault('foodAiAndroidSdkVersion', '0.7.1')

android {
  namespace 'com.google.cloud.foodai.ordering.reactnative'
  compileSdkVersion getExtOrIntegerDefault('compileSdkVersion', 36)

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault('minSdkVersion', 24)
    targetSdkVersion getExtOrIntegerDefault('targetSdkVersion', 36)
    consumerProguardFiles 'consumer-rules.pro'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  testOptions {
    unitTests.all {
      jvmArgs '-XX:+EnableDynamicAgentLoading', '-Dnet.bytebuddy.experimental=true'
    }
  }
}

repositories {
  google()
  mavenCentral()
  maven {
    url 'https://us-maven.pkg.dev/food-ai-prod-services/android-sdk'
  }
}

dependencies {
  // React Native New Architecture runtime provided by the host application.
  //noinspection GradleDynamicVersion
  implementation 'com.facebook.react:react-android'

  // Google Cloud Food Ordering AI Agent native Android SDK (Maven POM supplies transitive dependencies).
  implementation "com.google.android.foodorderingaiagent:foodorderingaiagent:${foodAiAndroidSdkVersion}"

  // Direct Kotlin and Coroutines compile dependencies of FoodOrderingModule.kt.
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${getExtOrStringDefault('kotlinVersion', '2.1.20')}"
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
  testImplementation 'org.mockito:mockito-core:5.11.0'
}
